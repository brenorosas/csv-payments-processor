[package]
name = "processor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
csv = "1.4.0"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio-rusqlite = "0.8.0"
rust_decimal = "1.43.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mockall = { version = "0.15.0", optional = true }

[features]
test-utils = ["dep:mockall"]

[dev-dependencies]
processor = { path = ".", features = ["test-utils"] }
